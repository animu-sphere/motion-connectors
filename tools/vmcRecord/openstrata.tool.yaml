# OpenStrata workspace-tool descriptor. `vmc_record` is the VMC adapter's CLI:
# the one part of this adapter a user runs, and the only part that meets a real
# sender (WORKSPACE.md §1 — "each adapter may also carry one CLI, declared
# beside it as an openstrata.tool.yaml").
#
# The connector owns acquisition. Only semantic export uses motionRecording.
#
# `ost` 0.21.0 does not discover this file: workspace members are the project
# root's immediate subdirectories and `libs/`, so nothing under
# `adapters/<group>/<name>/tools/` is loaded (report 34). The root CMake tree
# builds the tool and CTest runs its tests; this descriptor is what makes the
# adapter's artifact expressible when a per-library packaging command exists
# (WORKSPACE.md §5), not a claim that one does today.
schema: openstrata.tool/v1alpha1
tool:
  id: vmc_record
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.1.0
  license: Apache-2.0
executables: [vmc_record]
directories: [bin]
requires:
  libraries:
    - id: motionConnectorVmc
      version: ">=0.1,<0.2"
    # Artifact closure pin: motionRecording 0.5.2 requires motionSampling.
    - id: motionSampling
      version: ">=0.5,<0.6"
