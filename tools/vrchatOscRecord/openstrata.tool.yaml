# OpenStrata workspace-tool descriptor. `vrchat_osc_record` is the VRChat OSC
# connector's CLI: the one part of this connector a user runs, and the only
# part that meets a real sender (WORKSPACE.md §1 -- "each connector may also
# carry one CLI").
#
# It requires the connector, `motionConnectorTracking` and `motionRecording`.
# The second is the permission §2 grants a connector's *tool* and refuses its
# library -- assignment is an operator's statement about a rig, so a decoder
# that resolved it would have invented a calibration. The third is
# `WriteCaptureTraceFile` and nothing else: the hand-off to a consumer is a
# `motion-capture-trace` file, and `usd-motion-plugins`' `motion_record` is
# what replays one knowing nothing about this connector.
#
# §2 also permits this tool to author a stage, which is what separates a tool
# from its library. It does not, deliberately: the trace is the hand-off.
#
# The tool is a workspace member of its own, under the root tools/ where §2.1's
# dependency diagram puts every tool, so `ost` discovers this file directly.
schema: openstrata.tool/v1alpha1
tool:
  id: vrchat_osc_record
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.1.0
  license: Apache-2.0
executables: [vrchat_osc_record]
directories: [bin]
requires:
  libraries:
    - id: motionConnectorVrchatOsc
      version: ">=0.1,<0.2"
    # Named here where the sibling recorders name only their connector, and the
    # difference is the connector's edge set rather than the tool's. Theirs link
    # the recording package because they deliver a pose; this one does not, so
    # its tool takes both edges itself.
    - id: motionConnectorTracking
      version: ">=0.1,<0.2"
    - id: motionRecording
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:0cd010252deb1f4d145ed058d6e6a512eb916ac6a12aa63a2cab3a55e81d07d1
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:15f8a52d179f32088a5749ffaa3580ca1076e88a086e6dc9891510a12cfd1f82
          cy2026-macos-arm64-py313-usd:
            digest: sha256:11cd70c788805ec2745e2d8c82acd4a1191e7b379bfe439e67b08b2f31a8451c
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:31ba7ede419605c97956754d3907288b879f626fe45c6ccb864b3c5a415807b6
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:2ab1b6e957ac6deaab26eeb197ca76365225354dbdf442ae02f26e4bed78bb1c
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:44b6a855fad6acf8ed681a89900fa1fd6b690915596e239609c13116e79ec6e3
