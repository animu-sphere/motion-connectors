name: web-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      matrix:
        module: [motionConnectorWebXR, motionConnectorMediaPipe]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check acquisition and normalization without devices or models
        working-directory: web/${{ matrix.module }}
        run: npm test
      - name: Install pinned typecheck tooling
        working-directory: web/${{ matrix.module }}
        run: npm ci --ignore-scripts
      - name: Check public declarations against source API types
        working-directory: web/${{ matrix.module }}
        run: npm run typecheck
      - name: Check npm package contents
        working-directory: web/${{ matrix.module }}
        run: npm pack --dry-run
