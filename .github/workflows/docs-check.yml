# Hand-written (not generated by `ost ci generate`).
#
# Documentation consistency: every relative link and heading anchor resolves,
# and every place that restates the product version or the OpenUSD pin
# agrees with the one that defines it (scripts/check_docs.py). Deliberately
# cheap -- no runtime, no `ost`, no OpenUSD -- so it gates every change in
# seconds. Until the first import it is the only pull-request gate
# (openstrata.ci.yaml says why).
name: docs-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/MotionConnectorsOpenUsd.cmake"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/MotionConnectorsOpenUsd.cmake"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the checker's own rules
        run: python scripts/check_docs.py --selftest
      - name: Check links, anchors and mirrored versions
        run: python scripts/check_docs.py
