# Hand-written (not generated by `ost ci generate`).
#
# Documentation consistency: every relative link and heading anchor resolves,
# every version/pin mirror agrees, and documentation ownership and release
# availability stay consistent (scripts/check_docs.py). Deliberately
# cheap -- no runtime, no `ost`, no OpenUSD -- so it gates every change in
# seconds alongside the source, browser and acquisition boundary gates.
name: docs-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/MotionConnectorsOpenUsd.cmake"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/MotionConnectorsOpenUsd.cmake"
      - "scripts/check_docs.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the checker's own rules
        run: python scripts/check_docs.py --selftest
      - name: Check links, versions, documentation ownership and release availability
        run: python scripts/check_docs.py
