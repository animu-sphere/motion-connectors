# OpenStrata CI support matrix for motion-connectors.
#
# Policy: this file is the CI contract; .github/workflows/ost-*.yml are
# renderer output from `ost ci generate github`. Do not hand-edit CI semantics
# in the generated workflow YAML -- change this file and regenerate. One
# workflow is hand-written, for what this matrix cannot express:
# docs-check.yml checks documentation and builds nothing.
#
# Rendered since the first import (libs/motionConnectorTransport). Under ost
# 0.22.10 every rendered workspace job runs
# `ost plugin test --workspace --graph-only`, and that refuses a workspace with
# no member, so the scaffold committed this contract without its workflow; the
# first member is what made it renderable. 0.23.0 closed that: an explicitly
# empty workspace now validates as a zero-member graph, so the next repository
# to start empty renders its CI on day one. This one has had members since
# 2026-09-19, so nothing here changes.
#
# Lanes: one, `pull_request`, on GitHub-hosted runners. Each runner bootstraps
# the pinned `ost` below and pulls the runtime SDK from its OCI reference.
#
# Runtimes: the OpenUSD 26.08 leaves of OpenStrata's canonical runtime matrix,
# the same three digests usd-motion-plugins, usd-vrm-plugins and
# usd-mmd-plugins pin (usd-vrm-plugins'
# openstrata.ci.yaml records their provenance). The ecosystem pins one OpenUSD
# release because usd-avatar-runtime composes every package into one process
# (docs/architecture/DEPENDENCIES.md §1), so these are re-pinned together. The
# `ost` pin is 0.23.6 (2026-09-24), re-pinned across the ecosystem together
# with usd-motion-plugins, usd-vrm-plugins and usd-mmd-plugins. 0.23.6 installs
# a workspace dependency bundle into its own target-local stage as well as the
# shared link prefix, fixing 0.23.5's bundle-packaging regression
# (usd-vrm-plugins' ost report 47); nothing here ships a bundle. 0.23.5 stages
# bundle and tool outputs per target rather than in the source tree
# (usd-mmd-plugins' ost report 01) -- `ost build` now stages each tool from the
# build tree into its member's .strata/targets/<target>/tool-stage/bin -- and
# exposes a published bundle's or tool's pinned paths to the root CMake suites
# (usd-vrm-plugins' ost report 46), which nothing here pins yet. 0.23.4 checks a
# member build tree's runtime in `ost library build` and `ost plugin build` as
# well, and adds pins for a published bundle and a published test tool
# (usd-vrm-plugins' ost report 45); nothing here uses either yet. 0.23.3 pulls,
# graphs and validates an external library only a tool declares -- which
# `vrchat_osc_record`'s descriptor does here -- and discards a build tree
# configured against another runtime (usd-vrm-plugins' ost report 44). 0.23.2
# was taken for what it adds,
# not because it is current: `requires.libraries` can name a digest-pinned
# library artifact from another repository, and every rendered job pulls it
# (`ost library pull`) before it builds. This repository's remaining imports --
# motionTracking and the three adapters -- all link usd-motion-plugins'
# motionCore, so that edge is what they were waiting for (usd-vrm-plugins'
# ost report 41). The runtime leaves below do not move.
#
# 0.23.1 and not 0.23.0, because 0.23.0 could not be adopted: its new
# `consumer-link` claim in `ost runtime validate` probed the materialized
# runtime before the relocation `ost configure` and `ost plugin build` apply
# to that same prefix, and a generated job's order is pull -> validate ->
# build, so this repository's hosted Linux and Windows lanes went red on the
# pin bump alone (usd-vrm-plugins' ost report 42, measured and fixed the same
# day). 0.23.1 applies the repair before the claim, and 0.23.2 -- reported
# from this repository's own first import -- makes the ROOT build compose the
# external library artifacts a member declares, without which a workspace
# consuming a digest-pinned library from another repository cannot configure
# at all (report 43). This repository is the first to need that.
#
#   NOT `core` leaves: they are built --no-imaging, and no connector needs
#   anything from imaging -- but the `gl`/`metal` leaves are the ones the rest
#   of the ecosystem runs, and matching them keeps one OpenUSD build per
#   platform across the repositories.
#
# X11: OpenUSD 26.08's MaterialX exports an unconditional
# `find_dependency(X11 REQUIRED COMPONENTS Xt)` on non-Apple UNIX, so a Linux
# consumer of the runtime cannot configure without the X11 development
# headers. Every Linux cell declares them as `host_packages`.
#
# OpenUSD requirement: every cell that consumes a runtime declares
# `require_openusd` (the leaf's platform/os/arch/variant) and
# `require_openusd_version: "26.08"`, so `ost artifact pull|verify` refuses a
# re-pinned digest that is not the release cmake/MotionConnectorsOpenUsd.cmake pins,
# and so macOS's bash 3.2 never meets an empty "${openusd_args[@]}" under
# `set -u` (usd-mmd-plugins' first CI run failed on exactly that).
#
# Cell inventory -- four:
#   * workspace-graph-pr: the WORKSPACE.md §2 dependency gate
#     (`ost plugin test --workspace --graph-only`), before anything builds.
#   * workspace-pr-{windows,macos-arm64,linux}: the root CMake tree and its
#     CTest suite -- motionConnectorTransport's and motionConnectorOsc's unit
#     and boundary tests, the docs check and its self-test, and the installed-consumer lane
#     (workspace_installed_consumer), which installs the tree and configures a
#     consumer outside the repository.
schema: 1

bootstrap:
  ost:
    version: "0.23.6"
    repository: animu-sphere/open-strata

runners:
  windows-hosted:
    kind: github-hosted
    image: windows-2022
    billing:
      acknowledgement: required
  macos-arm64-hosted:
    kind: github-hosted
    image: macos-15
    billing:
      acknowledgement: required
  linux-hosted:
    kind: github-hosted
    image: ubuntu-24.04
    billing:
      acknowledgement: required

cells:
  - name: workspace-graph-pr
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    # A graph cell never materializes a runtime, but the contract still wants
    # the pin on record.
    runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
      expected_oci_digest: sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
    platform: cy2026
    profile: usd
    verify: graph

  - name: workspace-pr-windows
    kind: workspace
    lane: pull_request
    runner: windows-hosted
    runtime_artifact: sha256:ebb0c7da509ee14ada19ee5b461de6996aad0024b5c9640f12dde76912e849b5
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
      expected_oci_digest: sha256:d3ff79a6f330558c3b9a427a927d340fe3dcab1fe89107faa0ea9f66a104b7bf
    platform: cy2026
    profile: usd
    require_openusd: cy2026/windows/x86_64/gl
    require_openusd_version: "26.08"
    # The Windows runtime bundles no interpreter; the workspace tests run
    # under a Python 3.13 the runner must provide.
    host_python: "3.13"
    verify: test

  - name: workspace-pr-macos-arm64
    kind: workspace
    lane: pull_request
    runner: macos-arm64-hosted
    runtime_artifact: sha256:8d1322126b8f3aa4dd1791184603d7e1b4571bd4d6d89dd80bb75bdf5eef397c
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6
      expected_oci_digest: sha256:8486d94286b60cc20b53c926757f1802442569f9d9a7eecdadf2c9895b2efeb6
    platform: cy2026
    profile: usd
    require_openusd: cy2026/macos/arm64/metal
    require_openusd_version: "26.08"
    host_python: "3.13"
    verify: test

  - name: workspace-pr-linux
    kind: workspace
    lane: pull_request
    runner: linux-hosted
    runtime_artifact: sha256:3bf31789daa60ef650df35ab276bd67d0c0ee44a960311f78835cc0962efe261
    runtime_remote:
      uri: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
      expected_oci_digest: sha256:8d2d599489ee623044f4360ad3a2b979e2966e6ad2f949e5aa9083570e59cc4f
    platform: cy2026
    profile: usd
    require_openusd: cy2026/linux/x86_64/gl
    require_openusd_version: "26.08"
    host_python: "3.13"
    host_packages:
      apt: [libx11-dev, libxt-dev]
    verify: test
