# OpenStrata plain-library descriptor. motionConnectorOsc is the OSC 1.0 wire
# format, shared by every connector that speaks it
# (docs/architecture/WORKSPACE.md §1.1). It arrived from usd-vrm-plugins' osc,
# with its history.
#
# A library, not a plugin bundle: it registers nothing with OpenUSD and has no
# plugInfo.json.
#
# `requires` is absent rather than empty-by-accident. Its allowed edge set is
# **empty** (WORKSPACE.md §2), and empty of `motionConnectorTransport` too: a
# decoder that reads no socket needs nothing a transport owns. It knows no
# address semantics, no vendor grammar and no product name, and it holds no
# diagnostic *code* -- a code enum is frozen per connector and stays there.
schema: openstrata.library/v1alpha1
library:
  id: motionConnectorOsc
  # Mirrors the repository-root VERSION (docs/architecture/WORKSPACE.md §4).
  version: 0.1.0
cmake:
  package: motionConnectorOsc
  target: motionConnectorOsc::motionConnectorOsc
