# OpenStrata plain-library descriptor. motionConnectorMocopi is the native live
# input leaf: it decodes one capture product's *native* UDP packets into
# canonical motion values and stops there.
#
# A library, not a plugin bundle, and deliberately so -- it registers nothing
# with OpenUSD and has no plugInfo.json (WORKSPACE.md §1). The five edges below
# are the only ones it is allowed (WORKSPACE.md §2), and the sibling connector
# is emphatically not among them: a native decoder that reached
# `motionConnectorVmc` would inherit a relay's assumptions about framing,
# clocks and bone names, which is the one thing this connector exists to avoid.
# The two are siblings, never a stack.
#
# `motionConnectorTransport` is the fifth and is not that edge wearing a hat:
# it is a leaf under libs/ with an empty edge set of its own, holding the
# socket and the capture format the connectors had written twice, and it knows
# no protocol. `motionConnectorOsc` is absent on purpose -- this protocol is
# not OSC, and WORKSPACE.md §2 forbids the wire format of another one.
#
# What was one `motionRuntime` in usd-vrm-plugins is two packages here: the
# frame assembler reads `motionSampling`'s source interface and the live source
# writes `motionRecording`'s capture trace, so both are pinned beside
# `motionCore` rather than one standing in for the other. Its CLI has its own
# openstrata.tool.yaml under the root tools/.
schema: openstrata.library/v1alpha1
