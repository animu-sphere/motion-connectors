# OpenStrata plain-library descriptor. motionConnectorTracking is the middle of
# the three decisions between a tracker index and a joint: decode is a
# connector's, assignment is this library's, and the solve hands a pose to the
# motion layer ([CONNECTOR_CONTRACT.md §4](../../docs/design/CONNECTOR_CONTRACT.md#4-trackerobservation)).
# It arrived from usd-vrm-plugins' motionTracking, with its history.
#
# A library, not a plugin bundle: it registers nothing with OpenUSD and has no
# plugInfo.json (WORKSPACE.md §1.1).
#
# ITS ONE EDGE IS EXTERNAL, AND IT IS THIS REPOSITORY'S FIRST. The solve
# answers a pose, so it names `openstrata::motion::HumanJoint` and links
# `motionCore` -- which does not live here and never will (WORKSPACE.md §2.3).
# `ost` 0.23.0 is what lets that edge be declared rather than merely built:
# `artifact.targets` pins the published archive per target, `ost library pull`
# materializes it before the build, and the graph, `dependencies.json` and
# every package record carry it. In usd-vrm-plugins this same edge existed in
# CMake and in no descriptor -- which is why that repository's graph never
# listed motionTracking among motionCore's consumers, and why the declaration
# below is a correction as well as a move.
#
# The digests are usd-motion-plugins v0.5.2's, from that release's generated
# pin table. They are the ARCHIVE digests (stable across a republish); the
# `source` carries the OCI manifest digest (which is not), so re-pinning after
# a republish changes `source` and leaves `digest` alone.
#
# What the edge is NOT: a region does not resolve to a joint by aliasing the
# enum. Assignment stays this library's decision and the solve stays a
# function, so §2's refusal of a by-name alias is unchanged by having the type
# available.
schema: openstrata.library/v1alpha1
library:
  id: motionConnectorTracking
  # Mirrors the repository-root VERSION (docs/architecture/WORKSPACE.md §4).
  version: 0.1.0
requires:
  libraries:
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:c91e824f83e9daaad903561f2acf5c2bfaf02773406a9be8b89ab75136bb03ac
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:e56dd0916ae5a34d346bb5152cbb49ef4b49374e3e612bff0b613b767afe8360
          cy2026-macos-arm64-py313-usd:
            digest: sha256:9ca3835e8eb4dabef80867f1bebe4a4583745411ecef992b446d5bc4717e391f
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:08b8b83b3139325b64f32bba96223c5f726c412e2d7b5a1b3f3e9aa6704f6571
          cy2026-windows-x86_64-py313-usd:
            digest: sha256:1d2ac0bce7211539c008a0a584088d9acdebdada39f020ab489e3d7796eb29cb
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:9f05cf3b1c5c4663ef5350b3d37a0a1512b7692a72b993b2c25e50ed4c38de08
cmake:
  package: motionConnectorTracking
  target: motionConnectorTracking::motionConnectorTracking
