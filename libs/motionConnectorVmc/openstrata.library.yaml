# OpenStrata plain-library descriptor. motionConnectorVmc is an input leaf: it decodes
# one real-time protocol into canonical motion values and stops there.
#
# A library, not a plugin bundle, and deliberately so -- it registers nothing
# with OpenUSD and has no plugInfo.json (WORKSPACE.md §1). The four edges below
# are the *only* ones it is allowed (WORKSPACE.md §2); its CLI has its own
# openstrata.tool.yaml under tools/, which is where retarget and stage authoring
# become permissible.
#
# `motionConnectorTransport` is the third, and it is not a sibling edge wearing a hat: it
# is a leaf under libs/ with an empty edge set of its own, outside the aggregate
# product for the same reason an adapter is, holding the socket and the capture
# format this adapter and its sibling had written twice. `osc` is the fourth, on
# the same terms and from the same section, holding the wire format this adapter
# wrote alone until a second consumer proved the surface neutral. The two are
# siblings of each other rather than a stack, and this adapter is where they
# meet: WORKSPACE.md §2 forbids an edge between them in both directions.
schema: openstrata.library/v1alpha1
library:
  id: motionConnectorVmc
  # Mirrors VERSION; release preparation updates this in lockstep.
  version: 0.1.0
requires:
  libraries:
    - id: motionConnectorCore
      version: ">=0.1,<0.2"
    - id: motionCore
      version: ">=0.5,<0.6"
      artifact:
        targets:
          cy2026-linux-x86_64-py313-usd:
            digest: sha256:c91e824f83e9daaad903561f2acf5c2bfaf02773406a9be8b89ab75136bb03ac
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:e56dd0916ae5a34d346bb5152cbb49ef4b49374e3e612bff0b613b767afe8360
          cy2026-macos-arm64-py313-usd:
            digest: sha256:9ca3835e8eb4dabef80867f1bebe4a4583745411ecef992b446d5bc4717e391f
            source: oci://ghcr.io/animu-sphere/usd-motion-plugins@sha256:08b8b83b3139325b64f32bba96223c5f726c412e2d7b5a1b3f3e9aa6704f6571
          cy2026-windows-x86_64-py313-usd:
