[project]
name = "motion-connectors"
# Mirrors the repository-root VERSION file (WORKSPACE.md §4).
version = "0.1.0"

[requires]
platform = "cy2026"
profile = "usd"

# The member set, declared rather than discovered, each member named in full as
# the siblings name theirs: adding a member is a visible edit here, not a side
# effect of creating a directory. The table arrived with the first member,
# because older `ost` releases refused an empty one.
[workspace]
members = [
    "libs/motionConnectorCore",
    "libs/motionConnectorTransport",
    "libs/motionConnectorOsc",
    "libs/motionConnectorTracking",
    "libs/motionConnectorVmc",
    "tools/vmcRecord",
    "libs/motionConnectorMocopi",
    "tools/mocopiRecord",
    "libs/motionConnectorVrchatOsc",
    "tools/vrchatOscRecord",
    "tools/motionConnect",
]
